services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: nikupangishe-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nikupangishe_pass
      POSTGRES_DB: nikupangishe
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and socket sessions
  redis:
    image: redis:7-alpine
    container_name: nikupangishe-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass nikupangishe_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'nikupangishe_redis', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nikupangishe-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: nikupangishe_pass
      DB_NAME: nikupangishe
      DB_SSL: 'false'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: nikupangishe_redis
      JWT_SECRET: change_this_in_production_please
      JWT_REFRESH_SECRET: change_this_refresh_secret_too
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', '/nodejs/bin/node', '-e', "fetch('http://localhost:3000/api/v1/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: ['dist/database/start-production.js']

volumes:
  postgres_data:
  redis_data: